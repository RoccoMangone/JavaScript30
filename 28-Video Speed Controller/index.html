<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Video Speed Scrubber</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="https://fav.farm/🔥" />
</head>
<body>

  <div class="wrapper">
    <video class="flex" width="765" height="430" src="https://www.dropbox.com/scl/fi/uwj50jsm9ljalzfurzd1g/The-Obsession1_by-Marcus-Feria.mp4?rlkey=ztin9w2clowa4x8f32wk4mk31&st=bmz48m00&raw=1" loop controls></video>
    <div class="speed">
      <div class="speed-bar">1×</div>
    </div>
  </div>

<script>
    const speed = document.querySelector('.speed');
    const bar = speed.querySelector('.speed-bar');
    const video = document.querySelector('.flex');
    let isDown = false;

    speed.addEventListener('mousedown', function(e) {
        isDown = true;
        e.preventDefault();
    });

    speed.addEventListener('mouseup', function() {
        isDown = false;
    });

    speed.addEventListener('mouseleave', function() {
        isDown = false;
    });

    speed.addEventListener('mousemove', function(e) {
        if(!isDown) return;
        const y = e.pageY - this.offsetTop;
        const percent = y / this.offsetHeight;
        const min = 0.5;
        const max = 3;
        const height = Math.round(percent * 100) + '%';
        const rate = percent * (max - min) + min; //limits the speed between the max and min bounding numbers

        bar.style.height = height;
        bar.textContent = rate.toFixed(2) + 'x';

        video.playbackRate = rate;
    });

</script>
</body>
</html>
